description: Day 17 Support Chatbot Security Testing
targets:
  - id: http
    label: day17-support-chatbot
    config:
      url: http://127.0.0.1:5001/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: '{{prompt}}'
      transformResponse: json.reply
redteam:
