    Customer support chatbot that answers questions about orders, refunds and
    delivery. It must protect confidential information and reject unauthorized
    requests.
  numTests: 3
  plugins:
    - id: hijacking
      numTests: 3
    - id: pii:direct
      numTests: 3
    - id: pii:api-db
      numTests: 3
    - id: pii:session
      numTests: 3
    - id: pii:social
      numTests: 3
  strategies:
    - id: basic
    - id: prompt-injection
  entities: &ref_0 []
